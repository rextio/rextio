name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` lets the experimental Nuitka job opt in on a PR via the
    # `test-nuitka` label (see the `nuitka-e2e` job's `if:`).
    types: [opened, synchronize, reopened, labeled]
  # The real-Nuitka e2e is slow and Nuitka is an experimental backend, so it is
  # not run on every PR; it runs nightly and on manual dispatch instead.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint + type checks are platform/version independent (config pins py311),
  # so they run once rather than across the full matrix.
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Mypy (type-check)
        run: mypy
      - name: No residual rextio_runtime references
        # The dead helper crate was removed (mod-proposal P2-3); its only allowed
        # mention is the CHANGELOG note. Fail if a source/template reference
        # regresses. Word-bounded so identifiers that merely CONTAIN the string
        # (e.g. the generated `__rextio_runtime_dir` IPC helper) do not trip it.
        # (`git grep` exit 1 == no match == success.)
        run: |
          if git grep -nE '(^|[^_[:alnum:]])rextio_runtime($|[^_[:alnum:]])' -- ':!CHANGELOG.md' ':!.github/workflows/ci.yml'; then
            echo "::error::unexpected rextio_runtime reference (crate was removed)"
            exit 1
          fi

  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Pytest (unit/integration, e2e excluded)
        # The e2e suite requires a real Rust/Cargo toolchain and is run in the
        # `e2e` job; see mod-proposal P1-10 (e2e isolation).
        run: python -m pytest tests --ignore=tests/e2e -q

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Pytest with coverage gate (fail-under enforced via pyproject)
        run: python -m pytest tests --ignore=tests/e2e -q --cov

  e2e:
    name: E2E (real Rust/Cargo toolchain / py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Exercise the macOS-only generated `.cargo/config.toml` linker flags
        # (`-undefined dynamic_lookup`) that never run on ubuntu (council H4).
        os: [ubuntu-latest, macos-latest]
        # The floor and the ceiling of the supported interpreter range: a real
        # cargo/PyO3 compile on both continuously defends "validated on
        # 3.11-3.14" for the generated-native path, not just the Python side.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Pytest (e2e; conftest auto-skips absent toolchains)
        # Run the whole e2e directory rather than `-m needs_cargo`: the conftest
        # auto-skips tests whose toolchain is unavailable, while `-m needs_cargo`
        # would silently drop toolchain-free e2e tests (CLI smoke, zipapp) so they
        # ran in no CI lane. See mod-proposal P1-10 / council B2.
        # REXTIO_E2E_STRICT escalates the toolchain-classification warning to a
        # hard error so a misnamed test cannot slip through CI (council M4).
        env:
          REXTIO_E2E_STRICT: "1"
        run: python -m pytest tests/e2e -q
      - name: CUDA driver inventory probe cargo test (host; compile coverage)
        # Once per OS at Python 3.11: host cargo unit tests for the unpublished
        # probe. On macOS this covers UNSUPPORTED_TARGET; on Linux it covers the
        # host inventory path without claiming real-GPU evidence.
        if: matrix.python-version == '3.11'
        run: cargo test --locked --manifest-path tools/cuda-driver-probe/Cargo.toml
      - name: CUDA driver inventory probe (loose Linux CI; not real-GPU evidence)
        # Ubuntu-only loose validation + aarch64 compile-only check. The wrapper
        # builds the host probe; no separate cargo build. Cross-target cargo
        # check is compile coverage only (not a Linux aarch64 run, not GPU).
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          set -euo pipefail
          rustup target add aarch64-unknown-linux-gnu
          cargo check --locked \
            --manifest-path tools/cuda-driver-probe/Cargo.toml \
            --target aarch64-unknown-linux-gnu
          mkdir -p "${RUNNER_TEMP}/rextio-cuda-probe"
          ./scripts/validate-linux-cuda.sh \
            --output "${RUNNER_TEMP}/rextio-cuda-probe/cuda-driver-probe.json" \
            --target-dir "${RUNNER_TEMP}/rextio-cuda-probe/cargo-target"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "rextio-cuda-probe" / "cuda-driver-probe.json"
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["schema_version"] == "1"
          assert report["probe"] == "rextio-cuda-driver-probe"
          assert report["support_claim"] is False
          assert report["target"]["os"] == "linux"
          assert report["target"]["arch"] in {"x86_64", "aarch64"}
          assert report["platform_supported"] is True
          assert report["status"] in {"probe-complete", "unavailable", "error"}
          devices = report["devices"]
          assert isinstance(devices, list)
          if report["status"] == "probe-complete":
              assert report["driver_loaded"] is True
              assert isinstance(report["driver_version"], int)
              assert isinstance(report["device_count"], int)
              assert report["device_count"] > 0
              assert len(devices) == report["device_count"]
              for ordinal, device in enumerate(devices):
                  assert device["ordinal"] == ordinal
                  assert device["name"]
                  assert device["sm"].startswith("sm_")
          else:
              reason = report.get("reason_code")
              assert isinstance(reason, str) and reason
              assert "/" not in reason and "\\" not in reason and "=" not in reason
          # Loose CI lane: no GPU expected. Compile + fail-closed only.
          print("loose-linux-cuda-probe-ok", report["status"], report.get("reason_code"))
          PY

  nuitka-e2e:
    name: E2E (real Nuitka toolchain)
    # Nuitka is an experimental fallback backend and a real compile is slow, so
    # this is non-blocking: it does not run on ordinary PRs. It runs nightly, on
    # manual dispatch, and on a PR carrying the `test-nuitka` label. The fast
    # suite already covers the orchestration logic with a fake-nuitka stub; this
    # job exercises a real Nuitka compile + import of the produced artifact.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'test-nuitka')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test + Nuitka dependencies
        # The Nuitka fallback compiles the pure-Python module with the system C
        # compiler (gcc is preinstalled on ubuntu-latest); no Rust toolchain is
        # needed because the e2e app stays on the Python fallback path.
        run: python -m pip install -e ".[test,nuitka]"
      - name: Pytest (real-Nuitka e2e)
        run: python -m pytest tests/e2e -m needs_nuitka -q

  maturin-e2e:
    name: E2E (real maturin build)
    # The default build_tool is cargo; maturin is the optional wheel builder
    # (rextio[build]). The fast e2e job forces cargo, so this lane installs
    # maturin and exercises the real maturin native-build path on every push/PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install test + build (maturin) dependencies
        run: python -m pip install -e ".[test,build]"
      - name: Pytest (real-maturin e2e)
        run: python -m pytest tests/e2e -m needs_maturin -q

  package:
    name: Package (build + metadata + install smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install build twine check-wheel-contents
      - name: Build sdist and wheel
        # Clean any prior build tree first: setuptools reuses build/lib across
        # incremental builds, so a stale module deleted from the source tree can
        # otherwise be repackaged into the wheel (caught locally by the pinned
        # check-wheel-contents). CI checks out fresh, but this keeps the build
        # self-healing and matches the recommended local workflow.
        run: |
          rm -rf build dist
          python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Check wheel contents
        # Catch packaging mistakes the metadata check misses: stray files, files
        # outside the package, missing RECORD entries, etc. Rextio's own wheel is
        # pure-Python (py3-none-any); the platform-specific abi3/manylinux concern
        # applies to the *generated* hybrid artifacts, which build on the user's
        # machine, not to this tool's distribution.
        run: check-wheel-contents dist/*.whl
      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/rextio-wheel
          /tmp/rextio-wheel/bin/python -m pip install dist/*.whl
      - name: Install from the sdist into a clean environment
        # Rebuilding from the sdist catches files missing from the source
        # distribution (e.g. crate sources, templates) that a wheel install hides.
        run: |
          python -m venv /tmp/rextio-sdist
          /tmp/rextio-sdist/bin/python -m pip install dist/*.tar.gz
      - name: Smoke-test the installed console script (wheel + sdist)
        run: |
          work="$(mktemp -d)"
          printf 'import rextio\n\n@rextio.native\ndef add(a: int, b: int) -> int:\n    return a + b\n' > "$work/app.py"
          for env in /tmp/rextio-wheel /tmp/rextio-sdist; do
            "$env/bin/rextio" --help
            "$env/bin/python" -c "import rextio; print(rextio.__version__)"
            # Exercise a real command end-to-end from each installed distribution.
            "$env/bin/rextio" check "$work" --no-report
          done
