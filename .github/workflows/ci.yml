name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint + type checks are platform/version independent (config pins py311),
  # so they run once rather than across the full matrix.
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Mypy (type-check)
        run: mypy

  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Pytest (unit/integration, e2e excluded)
        # The e2e suite requires a real Rust/Cargo toolchain and is run
        # separately; see mod-proposal P1-10 (e2e isolation).
        run: python -m pytest tests --ignore=tests/e2e -q

  package:
    name: Package (build + metadata + install smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/rextio-install
          /tmp/rextio-install/bin/python -m pip install dist/*.whl
      - name: Smoke-test the installed console script
        run: |
          /tmp/rextio-install/bin/rextio --help
          /tmp/rextio-install/bin/python -c "import rextio; print(rextio.__version__)"
