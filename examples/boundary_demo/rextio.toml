[build]
native_backend = "rust"
fallback_backend = "cpython"

[rust]
binding = "pyo3"
build_tool = "maturin"

[fallback]
nuitka = "experimental"

[policy]
# This demo uses decorator-only discovery so fallback_helper remains fallback-only
# and compute_rejected demonstrates RXT070 boundary rejection.
native_marker = "decorator"
require_type_hints = true
allow_dynamic_features = false
boundary_warnings = true
