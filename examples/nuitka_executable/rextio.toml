[build]
native_backend = "rust"
fallback_backend = "cpython"

[rust]
binding = "pyo3"
build_tool = "cargo"

[policy]
native_marker = "auto"
require_type_hints = true
allow_dynamic_features = false
boundary_warnings = true

[executable]
entrypoint = "nuitka_executable.cli:main"
name = "nuitka_demo"
backend = "nuitka"
nuitka_mode = "onefile"
