[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rextio"
dynamic = ["version"]
description = "Alpha hybrid build tooling for typed Python functions."
readme = "PYPI.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Steve Si-young Song", email = "rextio.co@gmail.com"}
]
keywords = ["python", "rust", "compiler", "build-tool", "pyo3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rextio/rextio"
Repository = "https://github.com/rextio/rextio"
Issues = "https://github.com/rextio/rextio/issues"
Changelog = "https://github.com/rextio/rextio/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  # Property-based native<->fallback equivalence tests (tests/e2e). In `test` so
  # the e2e CI job (which installs `.[test]`) can run them.
  "hypothesis>=6.0",
]
# Optional toolchains used by `rextio build`. Rextio shells out to these; they
# are not Python runtime imports, so they stay optional and are surfaced by the
# build preflight check when missing (see rextio.build.preflight).
build = [
  "maturin>=1.0",
]
nuitka = [
  "nuitka>=2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.0",
  "ruff>=0.15",
  "mypy>=1.11",
]

[project.scripts]
rextio = "rextio.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "rextio.__about__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.check-wheel-contents]
# Pin the expected wheel layout so a packaging regression (a stray top-level file
# or module) fails CI deterministically, and a check-wheel-contents version bump
# cannot silently change the ruleset. Rextio's wheel is a single pure-Python
# top-level package built from src/. NOTE: update `toplevel`/`package` if the
# wheel layout ever changes (e.g. a second top-level package, a native extension
# module, or bundled data files) — otherwise legitimate additions will fail here.
toplevel = "rextio"
package = "src/rextio"

[tool.coverage.run]
source = ["rextio"]
branch = true

[tool.coverage.report]
show_missing = true
# The native-build and codegen-emit paths are exercised by the real-cargo e2e
# suite, which is excluded from the fast unit gate; the threshold leaves headroom
# for that (fast-suite branch coverage is ~82%).
fail_under = 80

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "needs_cargo: end-to-end test that requires a real Rust/Cargo toolchain",
  "needs_nuitka: end-to-end test that requires a real Nuitka toolchain",
  "needs_maturin: end-to-end test that requires a real maturin (and Cargo) toolchain",
  "no_toolchain: end-to-end test that needs no external toolchain (opts out of the conftest toolchain-classification warning)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Conservative bootstrap set (see mod-proposal P0-2): E/W = pycodestyle,
# F = pyflakes. D = pydocstyle, fully enforced (format + the missing-docstring
# family) except the D105/D107 exemptions below; see P2-2. Ratchet up to I (isort),
# UP (pyupgrade), B (bugbear) once the one-time autofix churn can be reviewed on its own.
select = ["E", "W", "F", "D"]
ignore = [
    # E501 (line length) is deferred to the formatter; not enforced during bootstrap.
    "E501",
    # Magic-method and __init__ docstrings are not required: a dunder's behavior is
    # conventional, and a class docstring documents construction.
    "D105",  # undocumented magic method
    "D107",  # undocumented public __init__
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests are not part of the documented API surface; docstring rules don't apply.
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
# Bootstrap posture: keep the gate green today, tighten incrementally.
# Do NOT add new modules to the ignore list below — fix types instead.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# The type-debt ratchet (mod-proposal P0-2) is now empty: every module
# type-checks cleanly, so there is no per-module ignore_errors override. Keep
# it that way — fix types rather than re-introducing an ignore list.
