[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rextio"
dynamic = ["version"]
description = "Alpha hybrid build tooling for typed Python functions."
readme = "PYPI.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Steve Si-young Song"}
]
keywords = ["python", "rust", "compiler", "build-tool", "pyo3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rextio/rextio"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
# Optional toolchains used by `rextio build`. Rextio shells out to these; they
# are not Python runtime imports, so they stay optional and are surfaced by the
# build preflight check when missing (see rextio.build.preflight).
build = [
  "maturin>=1.0",
]
nuitka = [
  "nuitka>=2.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.15",
  "mypy>=1.11",
]

[project.scripts]
rextio = "rextio.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "rextio.__about__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Conservative bootstrap set (see mod-proposal P0-2): E/W = pycodestyle,
# F = pyflakes. Ratchet up to I (isort), UP (pyupgrade), B (bugbear) once the
# one-time autofix churn can be reviewed on its own.
select = ["E", "W", "F"]
# E501 (line length) is deferred to the formatter; not enforced during bootstrap.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
# Bootstrap posture: keep the gate green today, tighten incrementally.
# Do NOT add new modules to the ignore list below — fix types instead.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# ---------------------------------------------------------------------------
# Type-debt ratchet (mod-proposal P0-2): these modules have pre-existing mypy
# errors recorded at gate-bootstrap time. Remove entries as they are cleaned
# up; the CI gate enforces type-cleanliness on every other module.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = [
  "rextio.analyzer.unsupported_patterns",
  "rextio.analyzer.jit",
  "rextio.config.loader",
  "rextio.codegen.rust.generator",
  "rextio.ir.nodes",
  "rextio.ir.lowering",
  "rextio.ir.module",
  "rextio.runtime.boundary_fallback",
  "rextio.plugins.loader",
  "rextio",
]
ignore_errors = true
